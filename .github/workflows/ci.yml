name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Lovable may update package.json before its generated lockfile lands.
      # npm install reconciles the lock while still using pinned transitive versions.
      - run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:ci
      - name: Migration history validation
        run: npm run migrations:validate
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: preview-dist
          path: dist
          retention-days: 7
